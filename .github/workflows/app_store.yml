name: Build & Upload ToTo Food iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Select Xcode 16.4
      # -----------------------------------------
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      # -----------------------------------------
      # Setup Flutter
      # -----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # -----------------------------------------
      # Install Apple Distribution Certificate
      # -----------------------------------------
      - name: Install distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions-keychain"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # -----------------------------------------
      # Install ToTo Food Provisioning Profile
      # -----------------------------------------
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/ToToFood.mobileprovision"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")

          echo "Provisioning Profile: $PROFILE_NAME"
          echo "Provisioning UUID: $PROFILE_UUID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # -----------------------------------------
      # Inspect provisioning profile
      # -----------------------------------------
      - name: Inspect provisioning profile
        run: |
          echo "================ PROFILE INFO ================"
          /usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist" || true
          /usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist" || true
          /usr/libexec/PlistBuddy -c "Print TeamIdentifier" "$RUNNER_TEMP/profile.plist" || true

          echo "================ PROFILE ENTITLEMENTS ================"
          /usr/libexec/PlistBuddy -c "Print Entitlements" "$RUNNER_TEMP/profile.plist" || true

      # -----------------------------------------
      # Show current Xcode signing settings
      # -----------------------------------------
      - name: Show signing configuration
        run: |
          grep -n \
            "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS\|PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo "================ RUNNER ENTITLEMENTS ================"
          cat ios/Runner/Runner.entitlements

      # -----------------------------------------
      # CocoaPods
      # -----------------------------------------
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # -----------------------------------------
      # Export Options
      # -----------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>SLSGP9WL73</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.toto.food.user</key>
                  <string>ToTo AppStore Profile</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      # -----------------------------------------
      # Build IPA with full diagnostic log
      # -----------------------------------------
      - name: Build ToTo Food IPA
        shell: bash
        run: |
          set -o pipefail

          flutter build ipa -v \
            --release \
            --build-name=1.0.0 \
            --build-number=4 \
            --export-options-plist=ios/ExportOptions.plist \
            2>&1 | tee flutter_build.log

      # -----------------------------------------
      # Show useful errors if build fails
      # -----------------------------------------
      - name: Show important build errors
        if: failure()
        shell: bash
        run: |
          echo "================================================"
          echo "IMPORTANT BUILD ERRORS"
          echo "================================================"

          grep -nEi \
            "error:|fatal error|failed|failure|provisioning|entitlement|codesign|code sign|PhaseScriptExecution|requires a provisioning profile|doesn't include|does not include|no profiles|Command .* failed" \
            flutter_build.log \
            | tail -300 || true

          echo ""
          echo "================================================"
          echo "LAST 400 LINES"
          echo "================================================"

          tail -400 flutter_build.log || true

      # -----------------------------------------
      # Always upload full build log
      # -----------------------------------------
      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToTo-Food-Build-Log
          path: flutter_build.log
          if-no-files-found: ignore

      # -----------------------------------------
      # Show generated IPA
      # -----------------------------------------
      - name: Show IPA
        if: success()
        run: |
          find build/ios/ipa -type f -name "*.ipa" -print

      # -----------------------------------------
      # Setup App Store Connect API Key
      # -----------------------------------------
      - name: Setup App Store Connect API Key
        if: success()
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf "%s" "$PRIVATE_KEY" > \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      # -----------------------------------------
      # Upload to App Store Connect
      # -----------------------------------------
      - name: Upload IPA to App Store Connect
        if: success()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -type f -name "*.ipa" | head -1)

          echo "Uploading: $IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      # -----------------------------------------
      # Keep IPA available in GitHub Actions
      # -----------------------------------------
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToTo-Food-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore