name: Deploy Build to App Store

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # ১. কোনো ম্যানুয়াল পড কমান্ড ছাড়া সরাসরি ফ্ল্যাটারের মাধ্যমে ফ্রেশ বিল্ড প্রিপারেশন করা
      - name: Clean and Pre-Build via Flutter
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Bundler & Fastlane
        run: |
          gem install bundler
          bundle install

      - name: Build and Deploy to App Store
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bundle exec fastlane ios upload_build_to_app_store
