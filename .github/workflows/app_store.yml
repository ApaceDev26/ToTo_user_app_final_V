name: Deploy Build to App Store

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # ১. ফ্ল্যাটারের অফিশিয়াল কমান্ড দিয়ে কোনো কোড সাইনিং ছাড়াই আইফোনের মূল বিল্ড (.ipa) তৈরি করা
      - name: Build Flutter iOS IPA
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Bundler & Fastlane
        run: |
          gem install bundler
          bundle install

      # ২. ফাস্টলেনের সাহায্যে তৈরি হওয়া .ipa ফাইলটি অ্যাপল স্টোরে পুশ করা
      - name: Deploy to App Store via Fastlane
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bundle exec fastlane ios upload_build_to_app_store
